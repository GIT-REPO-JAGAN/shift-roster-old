# .gitlab-ci.yml
# ─────────────────────────────────────────────────────────────────────────────
# GitLab CI/CD pipeline for Shift Roster Generator
#
# Stages:
#   lint     → ruff style/import checks
#   test     → pytest with coverage
#   generate → produce Roster-Out.xlsx and publish as artifact
# ─────────────────────────────────────────────────────────────────────────────

image: python:3.11-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ROSTER_INPUT:  "$CI_PROJECT_DIR/data/input/Roster - Input.xlsx"
  ROSTER_OUTPUT: "$CI_PROJECT_DIR/data/output/Roster - Out.xlsx"

cache:
  key: "$CI_COMMIT_REF_SLUG-pip"
  paths:
    - .cache/pip

stages:
  - lint
  - test
  - generate

# ─── Shared setup ─────────────────────────────────────────────────────────────
.install: &install
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet -r requirements-dev.txt
    - pip install --quiet -e .

# ─── Lint ─────────────────────────────────────────────────────────────────────
lint:ruff:
  stage: lint
  <<: *install
  script:
    - ruff check src/ tests/
  allow_failure: false

# ─── Test ─────────────────────────────────────────────────────────────────────
test:pytest:
  stage: test
  <<: *install
  script:
    - pytest --cov=roster --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days

# ─── Generate roster ──────────────────────────────────────────────────────────
generate:roster:
  stage: generate
  <<: *install
  script:
    - mkdir -p data/output
    - python -m roster --verbose
  artifacts:
    name: "Roster-Out-$CI_COMMIT_SHORT_SHA"
    paths:
      - data/output/
    expire_in: 30 days
  rules:
    # Run on main/master or when triggered manually
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - when: manual
